name: Build TweakLoader

on:
  workflow_dispatch:
    inputs:
      update_payload_in_worktree:
        description: "Also copy built TweakLoader.dylib into payloads/TweakLoader.dylib in the workflow workspace"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      update_entry2_slices_in_worktree:
        description: "Also replace payloads/entry2_type0x0f_arm64*.dylib in the workflow workspace"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    paths:
      - "TweakLoader/**"
      - ".github/workflows/build-tweakloader.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/.theos-ci/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          brew update
          # ensure ldid is available; fail early so signing step works
          brew install ldid

      - name: Install Theos
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/.theos-ci"
          git clone --recursive https://github.com/theos/theos "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone https://github.com/theos/sdks "$THEOS/sdks"

      - name: Build TweakLoader
        working-directory: TweakLoader
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/build dist/payloads

          cp -v TweakLoader/.theos/obj/TweakLoader.dylib dist/build/
          cp -v TweakLoader/.theos/obj/SpringBoardTweak.dylib dist/build/ || true
          cp -v TweakLoader/packages/*.deb dist/build/ || true

          cp -v TweakLoader/.theos/obj/TweakLoader.dylib dist/payloads/TweakLoader.dylib

          lipo -extract arm64 TweakLoader/.theos/obj/TweakLoader.dylib -output dist/payloads/entry2_type0x0f_arm64.dylib
          lipo -extract arm64e TweakLoader/.theos/obj/TweakLoader.dylib -output dist/payloads/entry2_type0x0f_arm64e.dylib

          if [[ "${{ inputs.update_payload_in_worktree || 'true' }}" == "true" ]]; then
            cp -v TweakLoader/.theos/obj/TweakLoader.dylib payloads/TweakLoader.dylib
            cp -v payloads/TweakLoader.dylib dist/payloads/TweakLoader.dylib
          fi

          if [[ "${{ inputs.update_entry2_slices_in_worktree || 'true' }}" == "true" ]]; then
            cp -v dist/payloads/entry2_type0x0f_arm64.dylib payloads/entry2_type0x0f_arm64.dylib
            cp -v dist/payloads/entry2_type0x0f_arm64e.dylib payloads/entry2_type0x0f_arm64e.dylib
          fi

          tar -czf dist/payloads-tweakloader.tar.gz -C dist payloads

      - name: Sign extracted slices
        run: |
          set -euo pipefail
          set -x
          # ensure ldid is present
          if ! command -v ldid >/dev/null 2>&1; then
            echo "ldid not found, attempting to install via brew"
            brew install ldid
          fi

          # Sign all dylibs produced in dist
          for f in dist/payloads/*.dylib; do
            [ -f "$f" ] && ldid -S "$f"
          done

          # Also sign any built dylibs in dist/build and the workspace payloads/ (if workflow copies them)
          for f in dist/build/*.dylib payloads/*.dylib; do
            [ -f "$f" ] && ldid -S "$f"
          done

          # Ensure the binaries have an LC_CODE_SIGNATURE by ad-hoc signing via codesign.
          for f in dist/payloads/*.dylib dist/build/*.dylib payloads/*.dylib payloads/*/entry2_type0x0f.dylib; do
            if [ -f "$f" ]; then
              codesign -s - --force --preserve-metadata=entitlements "$f"
            fi
          done

          # As a fallback, also apply an ad-hoc codesign so dyld sees an LC_CODE_SIGNATURE
          # (Useful when ldid doesn't actually embed a signature).
          for f in dist/payloads/*.dylib dist/build/*.dylib payloads/*.dylib payloads/*/entry2_type0x0f.dylib; do
            if [ -f "$f" ]; then
              if command -v codesign >/dev/null 2>&1; then
                codesign -s - --force --preserve-metadata=entitlements "$f" || true
              fi
            fi
          done

          # Ensure execute bit is set so the host can serve them correctly
          chmod +x dist/payloads/*.dylib || true
          chmod +x payloads/*.dylib || true

          # Also sign any per-hash entry2 files under payloads/*/entry2_type0x0f.dylib
          for p in payloads/*/entry2_type0x0f.dylib; do
            [ -f "$p" ] && ldid -S "$p" && chmod +x "$p"
          done

          # Produce a signatures report to include in the artifact so we can verify on download
          echo "Signature report generated at dist/signatures.txt" > dist/signatures.txt
          for f in dist/payloads/*.dylib dist/build/*.dylib payloads/*.dylib payloads/*/entry2_type0x0f.dylib; do
            if [ -f "$f" ]; then
              echo "== $f ==" >> dist/signatures.txt
              # prefer ldid output, fall back to codesign
              if command -v ldid >/dev/null 2>&1; then
                ldid -e "$f" >> dist/signatures.txt 2>&1 || echo "ldid -e failed for $f" >> dist/signatures.txt
              else
                codesign -d --verbose=4 "$f" >> dist/signatures.txt 2>&1 || echo "codesign -d failed for $f" >> dist/signatures.txt
              fi

                # Also record whether the Mach-O has an LC_CODE_SIGNATURE load command.
                if command -v otool >/dev/null 2>&1; then
                  if otool -l "$f" | grep -q LC_CODE_SIGNATURE; then
                    echo "LC_CODE_SIGNATURE present: True" >> dist/signatures.txt
                  else
                    echo "LC_CODE_SIGNATURE present: False" >> dist/signatures.txt
                  fi
                else
                  python3 -c 'import sys;print("LC_CODE_SIGNATURE present:",b"\x1d\x00\x00\x00" in open(sys.argv[1],"rb").read())' "$f" >> dist/signatures.txt 2>&1 || true
                fi
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tweakloader-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
